<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Preventivi - RP Ambienti</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f3ef; margin: 0; padding: 20px; color: #2c2c2a; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
  .sub { font-size: 13px; color: #6b6a66; margin: 0 0 16px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; max-width: 1100px; }
  .btn { padding: 9px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #2c2c2a; color: #fff; }
  .btn-secondary { background: #fff; color: #2c2c2a; border: 1px solid #ddd; }
  .btn-small { padding: 5px 10px; font-size: 12px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .dashboard { max-width: 1100px; background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }
  .dash-total { font-size: 26px; font-weight: 700; color: #3b6d11; }
  .dash-total.spent { color: #2c2c2a; }
  .dash-label { font-size: 12px; color: #888780; text-transform: uppercase; letter-spacing: 0.03em; }
  .dash-row { display: flex; gap: 40px; flex-wrap: wrap; }
  .chart-wrap { margin-top: 14px; overflow-x: auto; }
  .chart-bar-label { font-size: 10px; fill: #888; }
  .chart-value-label { font-size: 10px; fill: #3b6d11; font-weight: 600; }

  .match-banner { max-width: 1100px; background: #fff3e0; border: 1px solid #ffcc80; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; }
  .match-banner strong { color: #c05e00; }
  .match-item { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #ffcc80; }

  .quote-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; max-width: 1100px; }
  .quote-card { background: #fff; border-radius: 12px; padding: 14px 16px; cursor: pointer; border: 2px solid transparent; }
  .quote-card:hover { border-color: #ddd; }
  .quote-client { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .quote-meta { font-size: 12px; color: #888780; margin-bottom: 8px; }
  .status-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 12px; }
  .status-preventivo { background: #e8e6de; color: #6b6a66; }
  .status-da_ordinare { background: #fdecc8; color: #a06a00; }
  .status-ordinato { background: #d9ecc7; color: #3b6d11; }
  .quote-total { font-size: 14px; font-weight: 600; margin-top: 8px; }

  .modal-overlay { display:none; position: fixed; inset:0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; width: 90%; max-width: 380px; }
  .modal input, .modal select { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; margin-bottom: 12px; }
  .modal label { font-size: 12px; color: #888780; display: block; margin-bottom: 4px; }

  .detail-header { max-width: 1100px; background: #fff; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .detail-header .client-name { font-size: 18px; font-weight: 700; }
  .detail-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .detail-controls select, .detail-controls input { padding: 7px 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 12px; }

  .gap-banner { max-width: 1100px; background: #fce8e8; border: 1px solid #eab0b0; color: #a02020; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; }
  .promo-active-banner { max-width: 1100px; background: #edf3e6; border: 1px solid #a8c98a; color: #3b6d11; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; position: sticky; top: 0; background: #f4f3ef; padding: 8px 0; z-index: 10; }
  .tab { padding: 8px 14px; border-radius: 20px; background: #fff; border: 1px solid #e3e1d8; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .tab.active { background: #2c2c2a; color: #fff; border-color: #2c2c2a; }
  .section-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: #888780; margin: 22px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; max-width: 1100px; }
  .card { background: #fff; border: 2px solid #e3e1d8; border-radius: 12px; overflow: hidden; cursor: pointer; }
  .card:hover { border-color: #c9c7ba; }
  .card.selected { border-color: #3b6d11; box-shadow: 0 0 0 1px #3b6d11; }
  .card-photo { width: 100%; height: 115px; background: #f8f7f3; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 8px; }
  .card-photo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .card-body { padding: 9px 11px 11px; }
  .card-code { font-size: 10px; color: #888780; font-weight: 500; }
  .card-name { font-size: 12px; font-weight: 500; margin: 2px 0 6px; line-height: 1.25; min-height: 30px; }
  .price-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .price-old { font-size: 11px; color: #a3a19a; text-decoration: line-through; }
  .price-new { font-size: 15px; font-weight: 600; color: #712b13; }
  .badge-selected { display: none; font-size: 10px; font-weight: 500; color: #3b6d11; margin-top: 6px; }
  .card.selected .badge-selected { display: block; }

  .summary { max-width: 1100px; margin-top: 24px; padding: 16px 18px; background: #fff; border-radius: 12px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
  .summary-row.total { font-size: 16px; font-weight: 600; color: #712b13; border-top: 1px solid #eee; margin-top: 8px; padding-top: 10px; }
  .summary-row.savings { color: #3b6d11; font-size: 12px; }
  .empty-hint { font-size: 13px; color: #999; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Preventivi — RP Ambienti</h1>
    <p class="sub" style="margin:0">Catalogo Verinox 2026 — gestione multi-cliente</p>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary btn-small" onclick="exportBackup()">Esporta backup</button>
    <label class="btn btn-secondary btn-small" style="cursor:pointer">Importa backup<input type="file" accept=".json" style="display:none" onchange="importBackup(event)"></label>
    <button class="btn btn-primary" onclick="openNewQuoteModal()">+ Nuovo preventivo</button>
  </div>
</div>

<div id="listView">
  <div class="dashboard">
    <div class="dash-row">
      <div>
        <div class="dash-label">Speso netto (preventivi ordinati)</div>
        <div class="dash-total spent" id="dashSpent">€ 0,00</div>
      </div>
      <div>
        <div class="dash-label">Totale risparmiato</div>
        <div class="dash-total" id="dashTotal">€ 0,00</div>
      </div>
    </div>
    <div class="chart-wrap"><svg id="chartSvg" width="100%" height="140"></svg></div>
  </div>

  <div id="matchBanner"></div>

  <h2>I tuoi preventivi</h2>
  <div class="quote-list" id="quoteList"></div>
</div>

<div id="detailView" class="hidden">
  <div class="detail-header">
    <div>
      <div class="client-name" id="detailClientName"></div>
      <div class="quote-meta" id="detailMeta"></div>
    </div>
    <div class="detail-controls">
      <select id="statusSelect" onchange="updateStatus(this.value)">
        <option value="preventivo">Preventivo</option>
        <option value="da_ordinare">Da ordinare</option>
        <option value="ordinato">Ordinato</option>
      </select>
      <input type="date" id="deliveryInput" onchange="updateDelivery(this.value)" title="Data consegna prevista">
      <button class="btn btn-secondary btn-small" onclick="backToList()">← Torna alla lista</button>
    </div>
  </div>

  <div id="gapBanners"></div>

  <div class="tabs" id="tabs"></div>
  <div id="catalog"></div>

  <div class="summary">
    <div id="lines"><p class="empty-hint">Nessun prodotto selezionato.</p></div>
    <div class="summary-row"><span>Prezzo listino totale</span><span id="totalListino">€ 0,00</span></div>
    <div class="summary-row savings" id="savingsRow" style="display:none"><span>Risparmio promo</span><span id="savingsAmount">€ 0,00</span></div>
    <div class="summary-row total"><span>Totale preventivo</span><span id="totalFinal">€ 0,00</span></div>
  </div>
</div>

<div class="modal-overlay" id="newQuoteModal">
  <div class="modal">
    <h2>Nuovo preventivo</h2>
    <label>Nome cliente</label>
    <input type="text" id="newClientName" placeholder="Es. Mario Rossi">
    <div class="btn-row">
      <button class="btn btn-primary" onclick="createQuote()">Crea</button>
      <button class="btn btn-secondary" onclick="closeNewQuoteModal()">Annulla</button>
    </div>
  </div>
</div>

const STORAGE_KEY = 'rp_preventivi_v1';

let quotes = [];
let currentQuoteId = null;
let currentKit = null;

function loadQuotes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    quotes = raw ? JSON.parse(raw) : [];
  } catch(e) { quotes = []; }
}
function saveQuotes() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
}

const fmt = n => n.toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
const statusLabels = { preventivo: 'Preventivo', da_ordinare: 'Da ordinare', ordinato: 'Ordinato' };

function uid() { return 'q_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

// ---------- MODAL ----------
function openNewQuoteModal() { document.getElementById('newQuoteModal').classList.add('active'); document.getElementById('newClientName').value=''; }
function closeNewQuoteModal() { document.getElementById('newQuoteModal').classList.remove('active'); }
function createQuote() {
  const name = document.getElementById('newClientName').value.trim();
  if (!name) { alert('Inserisci il nome del cliente'); return; }
  const q = { id: uid(), client: name, createdAt: new Date().toISOString(), status: 'preventivo', deliveryDate: '', items: [] };
  quotes.push(q);
  saveQuotes();
  closeNewQuoteModal();
  openQuote(q.id);
}

// ---------- LIST VIEW ----------
function backToList() {
  currentQuoteId = null;
  document.getElementById('detailView').classList.add('hidden');
  document.getElementById('listView').classList.remove('hidden');
  renderList();
}

function computeItemGroups(items) {
  const groups = {};
  items.forEach(it => {
    const key = it.kit + '|' + it.brand;
    if (!groups[key]) groups[key] = [];
    groups[key].push(it);
  });
  return groups;
}

function computeGlobalOrdinatoGroups() {
  // Raggruppa gli articoli di TUTTI i preventivi "ordinato" insieme, per kit+brand.
  // Cosi' se due clienti diversi ordinano pezzi dello stesso brand e insieme
  // raggiungono la soglia promo (min 3), entrambi ottengono il prezzo promo.
  const groups = {};
  quotes.filter(qq => qq.status === 'ordinato').forEach(qq => {
    qq.items.forEach(it => {
      const key = it.kit + '|' + it.brand;
      if (!groups[key]) groups[key] = [];
      groups[key].push(it);
    });
  });
  return groups;
}

function getGroupsForQuote(q) {
  // Un preventivo "ordinato" viene valutato insieme a TUTTI gli altri preventivi
  // ordinati (per cogliere gli accoppiamenti tra clienti). Un preventivo ancora
  // "preventivo" o "da ordinare" viene valutato da solo.
  return q.status === 'ordinato' ? computeGlobalOrdinatoGroups() : computeItemGroups(q.items);
}

function quoteTotals(q) {
  const groups = getGroupsForQuote(q);
  let listino = 0, finale = 0;
  q.items.forEach(it => {
    const key = it.kit + '|' + it.brand;
    const promoActive = groups[key] && groups[key].length >= 3;
    listino += it.pn;
    finale += promoActive ? it.pp : it.pn;
  });
  return { listino, finale, savings: listino - finale };
}

function renderDashboard() {
  const ordinati = quotes.filter(q => q.status === 'ordinato');
  let totalSavings = 0;
  let totalSpent = 0;
  const byMonth = {};
  ordinati.forEach(q => {
    const t = quoteTotals(q);
    totalSavings += t.savings;
    totalSpent += t.finale;
    const dateRef = q.deliveryDate || q.createdAt;
    const monthKey = dateRef.slice(0,7); // YYYY-MM
    byMonth[monthKey] = (byMonth[monthKey] || 0) + t.savings;
  });
  document.getElementById('dashTotal').textContent = fmt(totalSavings);
  document.getElementById('dashSpent').textContent = fmt(totalSpent);

  const months = Object.keys(byMonth).sort();
  const svg = document.getElementById('chartSvg');
  svg.innerHTML = '';
  if (months.length === 0) {
    svg.innerHTML = '<text x="10" y="70" font-size="12" fill="#999">Nessun preventivo ordinato ancora — il grafico si popola quando segni un preventivo come "Ordinato".</text>';
    return;
  }
  const maxVal = Math.max(...months.map(m => byMonth[m]), 1);
  const barWidth = 50, gap = 20, chartHeight = 100, baseY = 110;
  const totalWidth = months.length * (barWidth + gap) + gap;
  svg.setAttribute('viewBox', `0 0 ${totalWidth} 140`);
  months.forEach((m, i) => {
    const val = byMonth[m];
    const h = (val / maxVal) * chartHeight;
    const x = gap + i * (barWidth + gap);
    const y = baseY - h;
    svg.innerHTML += `
      <rect x="${x}" y="${y}" width="${barWidth}" height="${h}" fill="#8fbf6a" rx="4"></rect>
      <text x="${x + barWidth/2}" y="${y - 6}" text-anchor="middle" class="chart-value-label">${fmt(val)}</text>
      <text x="${x + barWidth/2}" y="${baseY + 16}" text-anchor="middle" class="chart-bar-label">${m}</text>
    `;
  });
}

function renderMatchBanner() {
  const el = document.getElementById('matchBanner');
  const daOrdinare = quotes.filter(q => q.status === 'da_ordinare');
  const groups = {}; // key -> [{quoteId, client, count}]
  daOrdinare.forEach(q => {
    const g = computeItemGroups(q.items);
    Object.keys(g).forEach(key => {
      if (g[key].length < 3) {
        if (!groups[key]) groups[key] = [];
        groups[key].push({ client: q.client, count: g[key].length, id: q.id });
      }
    });
  });
  const suggestions = [];
  Object.keys(groups).forEach(key => {
    const entries = groups[key];
    const total = entries.reduce((s,e) => s + e.count, 0);
    if (total >= 3 && entries.length >= 2) {
      const [kit, brand] = key.split('|');
      suggestions.push({ kit, brand, entries, total });
    }
  });
  if (suggestions.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="match-banner"><strong>💡 Possibili accoppiamenti tra clienti per raggiungere la promo:</strong>' +
    suggestions.map(s => `
      <div class="match-item">
        <strong>${s.brand}</strong> (${s.kit}) — ${s.total} pezzi in totale tra:
        ${s.entries.map(e => `${e.client} (${e.count} pz)`).join(', ')}.
        Se ordini insieme, tutti sbloccano la promo.
      </div>`).join('') +
    '</div>';
}

function renderList() {
  renderDashboard();
  renderMatchBanner();
  const listEl = document.getElementById('quoteList');
  if (quotes.length === 0) {
    listEl.innerHTML = '<p class="empty-hint">Nessun preventivo ancora. Clicca "+ Nuovo preventivo" per iniziare.</p>';
    return;
  }
  const sorted = [...quotes].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  listEl.innerHTML = sorted.map(q => {
    const t = quoteTotals(q);
    return `
      <div class="quote-card" onclick="openQuote('${q.id}')">
        <div class="quote-client">${q.client}</div>
        <div class="quote-meta">${new Date(q.createdAt).toLocaleDateString('it-IT')} · ${q.items.length} prodotti${q.deliveryDate ? ' · consegna ' + new Date(q.deliveryDate).toLocaleDateString('it-IT') : ''}</div>
        <span class="status-badge status-${q.status}">${statusLabels[q.status]}</span>
        <div class="quote-total">${fmt(t.finale)}${t.savings > 0 ? ' <span style="color:#3b6d11;font-size:11px">(risparmio ' + fmt(t.savings) + ')</span>' : ''}</div>
      </div>`;
  }).join('');
}

// ---------- DETAIL VIEW ----------
function openQuote(id) {
  currentQuoteId = id;
  currentKit = PRODUCTS[0].kit;
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detailView').classList.remove('hidden');
  renderDetail();
}

function getCurrentQuote() { return quotes.find(q => q.id === currentQuoteId); }

function updateStatus(val) {
  const q = getCurrentQuote(); q.status = val; saveQuotes(); renderDetail();
}
function updateDelivery(val) {
  const q = getCurrentQuote(); q.deliveryDate = val; saveQuotes();
}

function renderDetail() {
  const q = getCurrentQuote();
  if (!q) { backToList(); return; }
  document.getElementById('detailClientName').textContent = q.client;
  document.getElementById('detailMeta').textContent = 'Creato il ' + new Date(q.createdAt).toLocaleDateString('it-IT');
  document.getElementById('statusSelect').value = q.status;
  document.getElementById('deliveryInput').value = q.deliveryDate || '';

  // gap banners
  const localGroups = computeItemGroups(q.items);
  const effectiveGroups = getGroupsForQuote(q);
  const gapEl = document.getElementById('gapBanners');
  let gapHtml = '';
  Object.keys(localGroups).forEach(key => {
    const [kit, brand] = key.split('|');
    const count = localGroups[key].length;
    const effectiveCount = effectiveGroups[key] ? effectiveGroups[key].length : count;
    if (q.status === 'ordinato' && effectiveCount >= 3) {
      const otherClients = [...new Set(effectiveGroups[key].map(it => it.__client).filter(c => c && c !== q.client))];
      gapHtml += `<div class="promo-active-banner">✓ ${brand} (${kit}): promo attiva — ${effectiveCount} pezzi ordinati in totale${otherClients.length ? ' (insieme a ' + otherClients.join(', ') + ')' : ''}.</div>`;
    } else if (count > 0 && count < 3) {
      gapHtml += `<div class="gap-banner">⚠ ${brand} (${kit}): hai ${count} pezzo${count>1?'i':''} selezionat${count>1?'i':'o'} — te ne manca${3-count>1?'no':''} ${3-count} per attivare la promo kit (min. 3).</div>`;
    } else if (count >= 3) {
      gapHtml += `<div class="promo-active-banner">✓ ${brand} (${kit}): promo attiva con ${count} pezzi.</div>`;
    }
  });
  gapEl.innerHTML = gapHtml;

  renderTabs();
  renderCatalog();
  renderSummary();
}

function renderTabs() {
  const kits = [...new Set(PRODUCTS.map(p => p.kit))];
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  kits.forEach(k => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (k === currentKit ? ' active' : '');
    tab.textContent = k;
    tab.onclick = () => { currentKit = k; renderTabs(); renderCatalog(); };
    tabsEl.appendChild(tab);
  });
}

function isSelected(q, kit, code) {
  return q.items.some(it => it.kit === kit && it.code === code);
}

function toggleProduct(p) {
  const q = getCurrentQuote();
  const idx = q.items.findIndex(it => it.kit === p.kit && it.code === p.code);
  if (idx >= 0) q.items.splice(idx, 1);
  else q.items.push({ ...p, __client: q.client }); // copia + tag cliente, mai riferimento diretto a PRODUCTS
  saveQuotes();
  renderDetail();
}

function renderCatalog() {
  const q = getCurrentQuote();
  const catalogEl = document.getElementById('catalog');
  catalogEl.innerHTML = '';
  const kitProducts = PRODUCTS.filter(p => p.kit === currentKit);
  const cats = [...new Set(kitProducts.map(p => p.cat))];
  cats.forEach(cat => {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = cat;
    catalogEl.appendChild(label);
    const grid = document.createElement('div');
    grid.className = 'grid';
    kitProducts.filter(p => p.cat === cat).forEach(p => {
      const sel = isSelected(q, p.kit, p.code);
      const card = document.createElement('div');
      card.className = 'card' + (sel ? ' selected' : '');
      card.innerHTML = `
        <div class="card-photo"><img src="${BASE}${p.photo}" alt="${p.name}"></div>
        <div class="card-body">
          <div class="card-code">${p.code}</div>
          <div class="card-name">${p.name}</div>
          <div class="price-row"><span class="price-old">${fmt(p.pn)}</span><span class="price-new">${fmt(p.pp)}</span></div>
          <div class="badge-selected">✓ selezionato</div>
        </div>`;
      card.onclick = () => toggleProduct(p);
      grid.appendChild(card);
    });
    catalogEl.appendChild(grid);
  });
}

function renderSummary() {
  const q = getCurrentQuote();
  const groups = getGroupsForQuote(q);
  const linesEl = document.getElementById('lines');
  if (q.items.length === 0) {
    linesEl.innerHTML = '<p class="empty-hint">Nessun prodotto selezionato.</p>';
  } else {
    linesEl.innerHTML = q.items.map(p => {
      const key = p.kit + '|' + p.brand;
      const promoActive = groups[key] && groups[key].length >= 3;
      return `<div class="summary-row"><span>${p.code} — ${p.name} <em style="color:#aaa">(${p.kit})</em></span><span>${fmt(promoActive ? p.pp : p.pn)}</span></div>`;
    }).join('');
  }
  const t = quoteTotals(q);
  document.getElementById('totalListino').textContent = fmt(t.listino);
  document.getElementById('totalFinal').textContent = fmt(t.finale);
  document.getElementById('savingsRow').style.display = t.savings > 0 ? 'flex' : 'none';
  document.getElementById('savingsAmount').textContent = fmt(t.savings);
}

// ---------- BACKUP ----------
function exportBackup() {
  const blob = new Blob([JSON.stringify(quotes, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'preventivi_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error('formato non valido');
      quotes = imported;
      saveQuotes();
      renderList();
      alert('Backup importato: ' + quotes.length + ' preventivi.');
    } catch(err) { alert('File non valido: ' + err.message); }
  };
  reader.readAsText(file);
}

// ---------- INIT ----------
loadQuotes();
renderList();
</script>
</body>
</html>
